map $uri $bnbu_log_uri {
    default $uri;
    ~^/api/v1/course-invites/[^/]+/preview$ /api/v1/course-invites/:inviteToken/preview;
    ~^/api/v1/course-invites/[^/]+/join-capabilities$ /api/v1/course-invites/:inviteToken/join-capabilities;
    ~^/api/v1/course-invites/[^/]+/join$ /api/v1/course-invites/:inviteToken/join;
    ~^/join/[^/]+$ /join/:inviteToken;
}

map $http_x_request_id $bnbu_request_id {
    "~^[A-Za-z0-9._:-]{1,64}$" $http_x_request_id;
    default $request_id;
}

log_format bnbu_api '$remote_addr [$time_local] '
                    '"$request_method $bnbu_log_uri $server_protocol" $status $body_bytes_sent '
                    'request_id=$bnbu_request_id upstream=$upstream_addr '
                    'upstream_status=$upstream_status request_time=$request_time '
                    'upstream_response_time=$upstream_response_time';
