server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.verityai.cn;

    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/verityai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verityai.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BNBU_WEB_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/bnbu-sports-admin.https.access.log bnbu_api;
    error_log /var/log/nginx/bnbu-sports-admin.https.error.log warn;

    client_max_body_size 1m;
    client_body_timeout 15s;
    send_timeout 15s;

    include /etc/nginx/snippets/bnbu-sports-api-locations.conf;

    location / {
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://sports-staging-media-1443273655.cos.ap-guangzhou.myqcloud.com; font-src 'self' data:; connect-src 'self'; media-src 'self' blob: https://sports-staging-media-1443273655.cos.ap-guangzhou.myqcloud.com" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Request-Id $bnbu_request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.verityai.cn;

    server_tokens off;
    root /opt/bnbu-sports/web/current/student;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/verityai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verityai.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BNBU_WEB_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/bnbu-sports-www.https.access.log bnbu_api;
    error_log /var/log/nginx/bnbu-sports-www.https.error.log warn;

    client_max_body_size 1m;
    client_body_timeout 15s;
    send_timeout 15s;

    include /etc/nginx/snippets/bnbu-sports-api-locations.conf;

    location ^~ /dev/ {
        return 404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://sports-staging-media-1443273655.cos.ap-guangzhou.myqcloud.com; font-src 'self' data:; connect-src 'self' https://sports-staging-media-1443273655.cos.ap-guangzhou.myqcloud.com; media-src 'self' blob: https://sports-staging-media-1443273655.cos.ap-guangzhou.myqcloud.com" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    }

    location / {
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://sports-staging-media-1443273655.cos.ap-guangzhou.myqcloud.com; font-src 'self' data:; connect-src 'self' https://sports-staging-media-1443273655.cos.ap-guangzhou.myqcloud.com; media-src 'self' blob: https://sports-staging-media-1443273655.cos.ap-guangzhou.myqcloud.com" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name verityai.cn;

    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/verityai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verityai.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BNBU_WEB_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/bnbu-sports-apex.https.access.log bnbu_api;
    error_log /var/log/nginx/bnbu-sports-apex.https.error.log warn;

    return 308 https://www.verityai.cn$request_uri;
}
